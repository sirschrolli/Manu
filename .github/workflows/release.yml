name: Release

# Erstellt ein GitHub-Release mit der fertigen JAR, sobald ein Versions-Tag (z. B. v0.1.0)
# gepusht wird. Die JAR kann dann dauerhaft unter "Releases" heruntergeladen werden.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Datengenerierung und Bauen
        run: ./gradlew runData build --stacktrace

      - name: GameTests
        run: ./gradlew runGameTestServer --stacktrace

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          prerelease: true
          generate_release_notes: true
