name: Build

# Baut die Mod bei jedem Push und Pull Request:
#   1. Datengenerierung (Modelle, Rezepte, Loot-Tables, Übersetzungen ...)
#   2. Kompilieren und JAR bauen
#   3. GameTests in einem echten Minecraft-26.3-Server
# Die fertige JAR liegt danach unter "Artifacts" auf der Seite des Workflow-Laufs.

on:
  push:
    branches: [ '**' ]   # alle Branches; für Versions-Tags gibt es release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # "bash" (statt Standard) bricht auch ab, wenn ein Befehl vor "| tee" fehlschlägt
        shell: bash
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Java 25 einrichten
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          # einfacher, quelloffener Cache (reicht für dieses Projekt)
          cache-provider: basic

      - name: Datengenerierung
        run: |
          mkdir -p ci-logs
          ./gradlew runData --stacktrace 2>&1 | tee ci-logs/datagen.log

      - name: Prüfen, ob die erzeugten Dateien eingecheckt sind
        run: |
          git add -N src/generated
          if ! git diff --quiet -- src/generated; then
            echo "::warning::src/generated/resources ist nicht aktuell. Bitte 'gradlew runData' ausführen und die Änderungen einchecken."
            git diff --stat -- src/generated | tail -20
          fi

      - name: Bauen
        run: ./gradlew build --stacktrace 2>&1 | tee ci-logs/build.log

      - name: GameTests im Minecraft-Server
        run: ./gradlew runGameTestServer --stacktrace 2>&1 | tee ci-logs/gametest.log

      - name: JAR hochladen
        uses: actions/upload-artifact@v7
        with:
          # die JAR direkt, ohne ZIP-Datei drumherum (heißt dann z. B. kingdomsatwar-0.1.0.jar)
          path: build/libs/*.jar
          archive: false
          if-no-files-found: error

      - name: Protokolle hochladen (nur wenn etwas fehlschlägt)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: protokolle
          path: |
            ci-logs/
            run/logs/
          if-no-files-found: ignore
