name: Dev tools (temporary)
on:
  push:
    branches: [ 'ci/dev-tools' ]
permissions:
  contents: write
jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Minecraft-Artefakte
        run: ./gradlew createMinecraftArtifacts --stacktrace
      - name: Dekompilieren
        run: |
          set -x
          JAR=$(ls build/moddev/artifacts/minecraft-patched-*.jar | head -1)
          VF=$(curl -sS https://repo1.maven.org/maven2/org/vineflower/vineflower/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')
          echo "Vineflower $VF"
          curl -sSL -o vineflower.jar "https://repo1.maven.org/maven2/org/vineflower/vineflower/$VF/vineflower-$VF.jar"
          mkdir -p mcsrc devtools
          java -Xmx6g -jar vineflower.jar -dgs=1 -rsy=1 -lit=1 -mpm=60 -log=WARN "$JAR" mcsrc/ > decompile.log 2>&1 || echo "Vineflower exit $?"
          tail -50 decompile.log
          ls -la mcsrc
          cp "$JAR" devtools/
          cp mcsrc/* devtools/ 2>/dev/null || true
          NF=$(find ~/.gradle/caches -name "neoforge-26.3*-universal.jar" 2>/dev/null | head -1); cp "$NF" devtools/ 2>/dev/null || true
          tail -200 decompile.log > devtools/decompile-tail.log
          ls -la devtools
          tar czf devtools.tar.gz devtools
          ls -la devtools.tar.gz
      - name: Verschlüsselt zurückgeben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          openssl cms -encrypt -stream -binary -aes256 -in devtools.tar.gz -out devtools.enc -outform DER ci/probe.crt
          mkdir out && split -b 45m -d devtools.enc out/devtools.enc.part && ls -la out && cd out
          git init -q && git checkout -q -b ci/probe-output && git add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "devtools ${{ github.run_id }}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/probe-output
