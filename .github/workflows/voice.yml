name: Voice final (temporary)
on:
  push:
    branches: [ 'ci/voice-req' ]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        variant: [ A, B, C ]
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      VOICE_TAKES: '3'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge und Texte aus dem Projekt holen
        run: |
          git fetch -q --depth 1 origin phase-1-grundprojekt
          git checkout FETCH_HEAD -- tools/audio src/main/resources/assets/kingdomsatwar/sounds src/main/resources/assets/kingdomsatwar/intro src/main/resources/assets/kingdomsatwar/sounds.json
          mkdir -p out/logs
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q sox libsox-fmt-all ffmpeg fluid-soundfont-gm > /dev/null
          df -h / | tee out/logs/disk.txt; nproc | tee -a out/logs/disk.txt
      - name: Werkzeuge zum Bewerten
        run: |
          set -o pipefail
          python -m venv /tmp/vw
          /tmp/vw/bin/pip install --no-cache-dir faster-whisper jiwer praat-parselmouth numpy 2>&1 | tail -2 | tee out/logs/01_eval_install.txt
      - name: Qwen3-TTS installieren
        run: |
          set -o pipefail
          python -m venv /tmp/vq
          { /tmp/vq/bin/pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -2
            /tmp/vq/bin/pip install --no-cache-dir -U qwen-tts soundfile 2>&1 | tail -4; } | tee out/logs/02_qwen_install.txt
      - name: Alle Zeilen sprechen (Stimme ${{ matrix.variant }} geklont)
        run: |
          set -o pipefail
          cd voice && /tmp/vq/bin/python qwen_final.py refs/${{ matrix.variant }}.mp3 ../out "$VOICE_TAKES" 2>&1 | grep -v "it/s\]\|pad_token_id\|flash-attn\|^\*\+$\|^ $" | tee ../out/logs/03_takes.txt
      - name: Beste Takes wählen
        run: |
          set -o pipefail
          /tmp/vw/bin/python voice/pick_takes.py out --no-slow 2>&1 | tee out/logs/04_pick.txt
      - name: Intro bauen (Nachbearbeitung, Zeitplan, Musik)
        run: |
          set -o pipefail
          python -m venv /tmp/va
          { /tmp/va/bin/pip install --no-cache-dir mido numpy scipy soundfile pyloudnorm librosa matplotlib 2>&1 | tail -2
            /tmp/va/bin/pip install --no-cache-dir --no-deps tinysoundfont 2>&1 | tail -1; } | tee out/logs/05_audio_install.txt
          mkdir -p /tmp/models && ln -sf /usr/share/sounds/sf2/FluidR3_GM.sf2 /tmp/models/FluidR3_GM.sf2
          /tmp/va/bin/python tools/audio/build_audio.py --models /tmp/models --only narration,music \
              --narration-source out/lines --narration-style natural --work out/audio-work 2>&1 | tee out/logs/06_build_audio.txt
      - name: Vorschau mischen
        continue-on-error: true
        run: |
          python voice/preview_mix.py src/main/resources/assets/kingdomsatwar de_de out/Intro_Vorschau_DE.wav
          python voice/preview_mix.py src/main/resources/assets/kingdomsatwar en_us out/Intro_Preview_EN.wav
      - name: Zurückgeben
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/final
          cp -r src/main/resources/assets/kingdomsatwar/sounds/intro out/final/ 2>/dev/null || true
          cp src/main/resources/assets/kingdomsatwar/intro/intro.json src/main/resources/assets/kingdomsatwar/sounds.json out/final/ 2>/dev/null || true
          cd out
          rm -rf takes audio-work/stems 2>/dev/null || true
          for f in Intro_*.wav lines/*.wav; do [ -f "$f" ] && ffmpeg -loglevel error -y -i "$f" -c:a libmp3lame -b:a 192k "${f%.wav}.mp3" && rm "$f"; done
          du -sh . ; ls -la
          git init -q && git checkout -q -b ci/voice-out-${{ matrix.variant }} && git add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "voice final ${{ matrix.variant }} ${{ github.run_id }}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/voice-out-${{ matrix.variant }}
