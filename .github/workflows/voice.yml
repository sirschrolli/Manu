name: Voice samples (temporary)
on:
  push:
    branches: [ 'ci/voice-req' ]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vorbereiten
        run: |
          mkdir -p out/logs
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q sox libsox-fmt-all ffmpeg > /dev/null
          df -h / | tee out/logs/disk.txt; free -g | tee -a out/logs/disk.txt; nproc | tee -a out/logs/disk.txt
      - name: Werkzeuge zum Bewerten
        run: |
          set -o pipefail
          python -m venv /tmp/vw
          /tmp/vw/bin/pip install --no-cache-dir faster-whisper jiwer praat-parselmouth numpy 2>&1 | tail -2 | tee out/logs/01_eval_install.txt
      - name: Qwen3-TTS installieren
        run: |
          set -o pipefail
          python -m venv /tmp/vq
          { /tmp/vq/bin/pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -2
            /tmp/vq/bin/pip install --no-cache-dir -U qwen-tts soundfile 2>&1 | tail -4
            /tmp/vq/bin/pip list 2>/dev/null | grep -i -E "^(torch|transformers|qwen)"; } | tee out/logs/02_qwen_install.txt
      - name: Hörproben der ersten Runde holen
        run: |
          set -o pipefail
          git fetch -q origin ci/voice-out
          mkdir -p /tmp/prev && git archive FETCH_HEAD | tar -x -C /tmp/prev
          for f in /tmp/prev/qwen_*.mp3; do [ -f "$f" ] && ffmpeg -loglevel error -y -i "$f" -ar 24000 -ac 1 "out/$(basename "${f%.mp3}").wav"; done
          ls -la out | tee out/logs/00_prev.txt
      - name: Stimmen gestalten (Qwen3-TTS VoiceDesign)
        run: |
          set -o pipefail
          cd voice && /tmp/vq/bin/python qwen_samples.py ../out 2>&1 | grep -v "it/s\]" | tee ../out/logs/03_qwen.txt
      - name: Bewerten und auswählen
        run: |
          set -o pipefail
          cd voice
          /tmp/vw/bin/python evaluate.py ../out 'qwen_*.wav' de sample eval_qwen.json 2>&1 | tee ../out/logs/04_eval.txt
          python pick_best.py ../out eval_qwen.json 3 | tee ../out/logs/05_pick.txt
      - name: Hörproben fertig machen
        run: |
          set -o pipefail
          cp voice/intro_music.ogg out/
          bash voice/finish_samples.sh out $(cat out/chosen.txt | sed 's/$/ /' | tr -d '\n') 2>&1 | tee out/logs/06_finish.txt
          rm -f out/intro_music.ogg
      - name: Zurückgeben
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cd out
          for f in *.wav; do [ -f "$f" ] && ffmpeg -loglevel error -y -i "$f" -c:a libmp3lame -b:a 192k "${f%.wav}.mp3" && rm "$f"; done
          ls -la
          git init -q && git checkout -q -b ci/voice-out && git add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "voice samples ${{ github.run_id }}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/voice-out
