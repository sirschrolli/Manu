name: Voice samples (temporary)
on:
  push:
    branches: [ 'ci/voice-req' ]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vorbereiten
        run: |
          mkdir -p out/logs
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q sox libsox-fmt-all ffmpeg > /dev/null
          df -h / | tee out/logs/disk.txt
      - name: Werkzeuge zum Bewerten
        continue-on-error: true
        run: |
          set -o pipefail
          python -m venv /tmp/vw
          /tmp/vw/bin/pip install --no-cache-dir faster-whisper jiwer praat-parselmouth numpy 2>&1 | tail -3 | tee out/logs/01_eval_install.txt
      - name: Referenzstimme (Thorsten-Voice, CC0)
        run: |
          set -o pipefail
          curl -sSL --retry 4 -o /tmp/thorsten.zip "https://zenodo.org/records/7265581/files/ThorstenVoice-Dataset_2022.10.zip?download=1"
          ls -la /tmp/thorsten.zip | tee out/logs/02_download.txt
          cd voice && python thorsten_ref.py /tmp/thorsten.zip ../out 2>&1 | tee ../out/logs/03_reference.txt
          rm -rf ../out/thorsten /tmp/thorsten.zip
      - name: Stimme erzeugen (Chatterbox)
        run: |
          set -o pipefail
          python -m venv /tmp/vc
          { /tmp/vc/bin/pip install --no-cache-dir torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -2
            /tmp/vc/bin/pip install --no-cache-dir chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -4; } | tee out/logs/04_chatterbox_install.txt
          cd voice && /tmp/vc/bin/python chatterbox_epic.py ../out de 2>&1 | tee ../out/logs/05_chatterbox_de.txt
      - name: Episch nachbearbeiten
        run: |
          set -o pipefail
          cp voice/intro_music.ogg out/
          bash voice/epic.sh out de 2>&1 | tee out/logs/06_epic.txt
          rm -f out/intro_music.ogg
      - name: Bewerten
        continue-on-error: true
        run: |
          cd voice
          /tmp/vw/bin/python evaluate.py ../out 'raw_*_de.wav' de sample eval_raw_de.json 2>&1 | tee ../out/logs/07_eval.txt
          /tmp/vw/bin/python evaluate.py ../out 'ref_*.wav' de design eval_ref.json > /dev/null 2>&1 || true
      - name: Zurückgeben
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cd out
          for f in sample_*.wav music_*.wav ref_*.wav raw_*.wav; do [ -f "$f" ] && ffmpeg -loglevel error -y -i "$f" -c:a libmp3lame -b:a 192k "${f%.wav}.mp3" && rm "$f"; done
          ls -la
          git init -q && git checkout -q -b ci/voice-out && git add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "voice samples ${{ github.run_id }}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/voice-out
