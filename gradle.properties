# Speicher für Gradle. Die Datengenerierung braucht etwas mehr als der Standard.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---------------------------------------------------------------------------
# Minecraft / NeoForge
# Aktuelle NeoForge-Versionen: https://projects.neoforged.net/neoforged/neoforge
# ---------------------------------------------------------------------------
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.98

# ---------------------------------------------------------------------------
# Mod-Eigenschaften
# ---------------------------------------------------------------------------
# Eindeutige Mod-ID (nur Kleinbuchstaben). Muss mit KingdomsAtWar.MODID übereinstimmen.
mod_id=kingdomsatwar
mod_name=Kingdoms at War
mod_license=All Rights Reserved
mod_version=0.7.0
mod_group_id=io.github.sirschrolli.kingdomsatwar
mod_authors=sirschrolli
